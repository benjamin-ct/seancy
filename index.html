<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      media="(prefers-color-scheme: dark)"
      href="/apple-touch-icon-dark.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1a30" />
    <!-- Pas de apple-mobile-web-app-status-bar-style="black-translucent" :
         avec viewport-fit=cover, il faisait dessiner la page sous la barre de
         statut de la PWA installée iOS, et depuis iOS 26 le système recouvre
         cette zone d'un flou Liquid Glass (scroll edge effect) qui déborde
         d'environ 40pt sur le header — bande floue en haut de toute l'appli,
         sans aucun moyen CSS de la désactiver. Sans cette meta, la page démarre
         sous une barre de statut opaque, peinte avec theme-color (résolu avant
         le premier paint par theme-init.js) ; env(safe-area-inset-top) y vaut
         0. Limite : un changement de thème en cours de session ne repeint la
         barre de statut qu'au relancement de l'appli installée. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Découvrez où regarder vos films et séries en streaming, tirez un titre au hasard, et suivez ce que vous avez déjà vu."
    />
    <title>Seancy — Films &amp; séries à regarder</title>
    <!-- Fichier externe (pas de <script> inline) : la CSP du Worker n'inclut
         pas 'unsafe-inline' sur script-src, voir public/theme-init.js pour
         le détail. Bloquant (pas de defer/async/module) pour s'exécuter
         avant le premier paint du loader ci-dessous. Après les icônes et le
         <title> : il les remplace par ceux de l'espace admin sur ses pages. -->
    <script src="/theme-init.js"></script>
    <!-- Aperçu de lien par défaut. Pour les fiches, profils et listes, le
         Worker remplace ces balises par celles de la page quand c'est un
         robot qui demande (voir worker/page-meta.ts). L'image doit être une
         URL absolue : celle de la prod. -->
    <meta property="og:site_name" content="Seancy" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Seancy — Films &amp; séries à regarder" />
    <meta
      property="og:description"
      content="Découvrez où regarder vos films et séries en streaming, tirez un titre au hasard, et suivez ce que vous avez déjà vu."
    />
    <meta property="og:image" content="https://seancy.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Affiches TMDB : connexion (DNS + TLS) ouverte dès le HTML, avant que le
         JS ne demande la première image (audit M9). -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <style>
      /* Loader affiché avant que React (et global.css/variables.css) ne soit
         chargé : couleurs dupliquées en dur ici (pas d'accès aux custom
         properties tant que ce fichier n'est pas chargé), calées sur le
         thème sombre par défaut de variables.css. Le thème réel (choix
         explicite stocké ou repli système) est résolu par theme-init.js,
         chargé ci-dessus *avant* ce bloc, via l'attribut data-theme sur <html> —
         seule source de vérité, plus fiable qu'une media query dupliquée ici
         qui ignorerait un choix explicite différent du système (flash au
         montage de React). Retiré après le premier rendu (src/core/initialLoader.ts). */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #09162b;
        transition: opacity 0.2s ease;
      }

      #app-loader__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.16);
        border-top-color: #c1443f;
        animation: app-loader-spin 0.8s linear infinite;
      }

      html[data-theme="light"] #app-loader {
        background-color: #fbf9f5;
      }

      html[data-theme="light"] #app-loader__spinner {
        border-color: oklch(0.9 0.014 80);
        border-top-color: #a53a35;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loader__spinner {
          animation: none;
        }
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #app-loader.app-loader--hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loader" role="status" aria-label="Chargement de Seancy">
      <div id="app-loader__spinner"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
