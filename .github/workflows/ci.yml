# Intégration continue : bloque toute PR (et tout push sur main/develop) dont
# le format, le lint, le typecheck, les vérifications de logique pure ou le
# build échouent.
#
# Le lint (oxlint) est l'étape "linter bloquant" : il sort en code non nul
# dès qu'une règle de sévérité `error` est violée (voir .oxlintrc.json,
# ex. react/rules-of-hooks). Le typecheck (tsc, projet composite à 4
# tsconfig — app/node/worker/sw) échoue sur la moindre erreur de type, y
# compris un `any` implicite (strict: true partout, voir tsconfig.*.json).
name: CI

on:
  push:
    # `develop` : environnement persistant (voir ticket Trello "Avenir du
    # développement"), base D1 `seancy-develop` + déploiement Cloudflare
    # Preview nommé "develop" (job deploy-develop). Migrations prod
    # (apply-d1-migrations) restent strictement limitées à `main`, voir le
    # garde-fou sur ce job.
    branches: [main, develop]
  pull_request:
    # "closed" (fermeture ou merge) est nécessaire en plus des types par
    # défaut (opened/synchronize/reopened) pour déclencher le nettoyage de la
    # base D1 de preview du job cleanup-preview-d1 ci-dessous.
    types: [opened, synchronize, reopened, closed]

# Annule une exécution précédente encore en cours sur la même réf (ex.
# nouveau push sur une PR) pour ne pas gaspiller de runners.
#
# Le nom de l'événement est inclus dans le groupe en plus de la réf : pour
# une PR fermée par merge, le push sur `main` et le `pull_request` "closed"
# déclenchés au même instant partagent tous les deux `github.ref` =
# `refs/heads/main` (GitHub réutilise la réf de la base une fois la réf de
# fusion éphémère de la PR supprimée). Sans cette distinction, le run
# "closed" — démarré quelques instants après le run "push" — annule ce
# dernier avant qu'il n'exécute quoi que ce soit (lint/build/scan
# secrets/migrations D1), et ce à chaque merge.
#
# `cancel-in-progress` est désactivé pour les runs `push` : deux merges
# rapprochés sur `main` partagent le même groupe (`ci-push-refs/heads/main`)
# puisque `github.ref` vaut toujours `refs/heads/main`. Si on annulait, le
# run du premier merge — et donc ses migrations D1 — pourrait être coupé par
# celui du second avant d'avoir tourné. En laissant `cancel-in-progress` à
# `false` ici, les runs `push` se mettent en file et s'exécutent l'un après
# l'autre au lieu de s'annuler ; les runs `pull_request` (superflus dès
# qu'un nouveau push écrase le précédent) continuent, eux, à s'annuler.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  verify:
    name: Format, lint, typecheck, tests & build
    # Rien à vérifier côté code à la fermeture d'une PR (cf. types:
    # [..., closed] ajouté ci-dessus pour déclencher cleanup-preview-d1) :
    # ne pas gaspiller un run pour ça.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dépendances (vulnérabilités connues)
        run: npm audit --audit-level=high

      - name: Formatage (Prettier, bloquant)
        run: npm run format:check

      - name: Lint (bloquant sur les erreurs)
        run: npm run lint

      - name: Typecheck (TypeScript strict, bloquant)
        run: npm run typecheck

      # Limité aux fichiers/dépendances jamais importés (signal fiable, faux
      # positifs quasi nuls) — pas aux exports/types inutilisés : le projet en
      # a un stock existant (barrels, types miroir de l'API TMDB/du schéma
      # D1...) qui demanderait un nettoyage à part, hors scope de ce ticket
      # (audit F5). Voir knip.json pour les points d'entrée (scripts/*.ts,
      # infra/, public/theme-init.js — jamais importés par le bundle Vite).
      - name: Code mort (knip, bloquant sur fichiers/dépendances inutilisés)
        run: npm run check:dead-code

      - name: Vérifications de logique pure
        run: |
          npm run verify:upcoming-badge
          npm run verify:series-episode-badge
          npm run verify:movie-release-badge
          npm run verify:movie-meta
          npm run verify:tmdb-concurrency-cap
          npm run verify:numeric-range-filter
          npm run verify:global-providers
          npm run verify:bot-detection
          npm run verify:bot-detection-client
          npm run verify:rate-limit-memory
          npm run verify:tmdb-proxy-policy
          npm run verify:tmdb-retry-after
          npm run verify:tmdb-edge-cache
          npm run verify:security-headers
          npm run verify:changeset-parsing
          npm run verify:changelog-release

      - name: Build
        run: npm run build

      - name: Budget de taille du bundle initial
        run: npm run check:bundle-size

  secrets-scan:
    name: Scan secrets (gitleaks)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fragment de changelog requis sur toute PR qui touche du code produit —
  # voir .changeset/README.md et scripts/check-changeset.ts. fetch-depth: 0
  # nécessaire pour calculer le diff contre la base réelle (le clone
  # superficiel par défaut n'a pas cette réf).
  check-changeset:
    name: Gates release (fragment changelog + version intacte)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-changeset.ts
        env:
          BASE_REF: origin/${{ github.base_ref }}
      # Gate CI preprod (ticket Trello "Épique git-flow : CI preprod avancée
      # sur develop") : le champ "version" de package.json n'est touché que
      # par le job release-changelog, jamais à la main dans une PR — voir
      # scripts/check-version-untouched.ts.
      - run: node scripts/check-version-untouched.ts
        env:
          BASE_REF: origin/${{ github.base_ref }}

  # Gates supplémentaires avant qu'une release `develop` → `main` ne soit
  # jugée possible (ticket Trello "Épique git-flow : CI preprod avancée sur
  # develop", portée précisée par Benjy_CT le 2026-10-10 : "les checks
  # nécessaires à s'assurer que c'est bien prêt pour partir en prod" — audit
  # plus restrictif que le job verify, scan anti-PII des fixtures). gitleaks
  # tourne déjà sur ce push via secrets-scan (ci-dessus, sans restriction
  # d'event) : pas dupliqué ici.
  develop-release-gates:
    name: Gates pré-release (develop)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Plus restrictif que le "high" du job verify (PR) : sur develop,
      # juste avant une release possible, on veut voir les vulnérabilités
      # modérées aussi, pas seulement les plus critiques.
      - name: Audit dépendances (plus restrictif, pré-release)
        run: npm audit --audit-level=moderate
      - run: node scripts/check-pii-fixtures.ts

  deploy-preview:
    name: Deploy preview & comment
    needs:
      - verify
      - secrets-scan
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      # Base D1 dédiée à cette PR (créée si besoin, réutilisée sur les pushs
      # suivants) : voir scripts/preview-d1.ts pour la logique de
      # provisioning et d'attente en cas de plan gratuit saturé. Génère
      # wrangler.preview.generated.jsonc, utilisé par le déploiement
      # ci-dessous à la place de wrangler.jsonc.
      - name: Provision D1 preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/preview-d1.ts provision ${{ github.event.pull_request.number }}

      # Bascule Bobine → Seancy : version provisoire du Worker seancy tant
      # qu'il n'a jamais été déployé, sinon ses réglages restent grisés dans
      # le dashboard. Sans effet ensuite (voir scripts/seancy-bootstrap-worker.ts).
      - name: Bootstrap Worker seancy (once)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/seancy-bootstrap-worker.ts

      - name: Generate branch slug for preview name
        id: branch-slug
        run: |
          # Le tronquage à 30 caractères doit passer APRÈS le nettoyage des
          # tirets de bord : sinon, quand la coupe tombe pile sur un tiret
          # (ex. branche "fix/affiches-manquantes-envie-de-voir" -> slug
          # "fix-affiches-manquantes-envie-"), le tiret final réapparaît
          # après troncature et Cloudflare rejette le nom (code 10021).
          # D'où le second nettoyage, après la coupe. Même calcul dans le
          # job cleanup-preview-d1 (suppression de la preview).
          SLUG=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | cut -c1-30 | sed 's/^-*//;s/-*$//')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      # Cloudflare Previews (`wrangler preview`) plutôt que `wrangler
      # versions upload --preview-alias` : Cloudflare ne génère aucune URL
      # de version pour un Worker qui implémente un Durable Object
      # (UserSyncHub), l'ancienne URL construite à la main pointait donc
      # dans le vide. Une Preview est un environnement à part entière, avec
      # ses propres instances de Durable Objects (isolées de la prod et des
      # autres previews) et ses propres URLs, renvoyées par l'API.
      # Ni les secrets (TMDB_API_KEY...) ni les variables (VAPID_PUBLIC_KEY,
      # RECAPTCHA_SITE_KEY...) ne sont hérités de la prod : tous viennent de
      # la "Preview base config" du Worker (dashboard, ou `wrangler preview
      # base-config`), avec ses propres clés d'API — voir
      # scripts/preview-d1.ts, writePreviewConfig.
      - name: Deploy Worker preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: >-
          npx wrangler preview
          --config wrangler.preview.generated.jsonc
          --name "${{ steps.branch-slug.outputs.slug }}"
          --message "PR #${{ github.event.pull_request.number }}"

      # L'URL publiée doit être celle du Worker (*.workers.dev), jamais celle
      # du domaine `preview.dev.seancy.com` : ce dernier est sujet à un cache
      # d'edge qui sert trop souvent une version obsolète (ticket Trello
      # "URL de preview"). preview_urls (alias stable, basé sur le nom de la
      # PR, cf. --name ci-dessus) est préféré à deployment_urls (sous-domaine
      # différent à chaque déploiement) pour retrouver le même comportement
      # qu'avant l'introduction de `wrangler preview` : une URL stable sur
      # toute la durée de la PR. Dans les deux cas, seule l'entrée
      # *.workers.dev du tableau d'URLs renvoyé par Cloudflare est retenue.
      # Sans URL correspondante (Preview Deployments désactivés sur
      # workers.dev...), le job échoue explicitement plutôt que d'annoncer
      # une preview inutilisable ou de retomber sur le domaine problématique.
      - name: Read preview URL
        id: preview-url
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          URL=$(node -e '
            const lines = require("node:fs").readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").split("\n");
            const entry = lines.filter(Boolean).map((line) => JSON.parse(line)).findLast((e) => e.type === "preview");
            const urls = [...(entry?.preview_urls ?? []), ...(entry?.deployment_urls ?? [])];
            console.log(urls.find((u) => u.includes(".workers.dev")) ?? "");
          ')
          if [ -z "$URL" ]; then
            echo "::error::Cloudflare n'a renvoyé aucune URL *.workers.dev pour cette preview (Preview Deployments désactivés sur workers.dev ?)."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post preview URL as comment on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url
          message: |
            🚀 **Preview deployed** for this commit (`${{ github.sha }}`)

            👉 ${{ steps.preview-url.outputs.url }}

            <sub>This url stays stable for the duration of the PR (Cloudflare Preview : `${{ steps.branch-slug.outputs.slug }}`)</sub>

  cleanup-preview-d1:
    name: Cleanup D1 preview database
    # Ni verify/secrets-scan ni deploy-preview n'ont besoin d'avoir réussi
    # pour nettoyer : indépendant du sort de la PR (mergée ou simplement
    # fermée), on veut toujours libérer la base D1 si elle a été créée.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Delete D1 preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/preview-d1.ts cleanup ${{ github.event.pull_request.number }}
      # Supprime aussi la Cloudflare Preview (et ses Durable Objects).
      # Même calcul de nom que dans deploy-preview. Ne fait pas échouer le
      # job si la preview n'a jamais été créée (PR fermée avant tout
      # déploiement réussi).
      - name: Delete Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | cut -c1-30 | sed 's/^-*//;s/-*$//')
          npx wrangler preview delete --name "$SLUG" --skip-confirmation || echo "::warning::Preview '$SLUG' introuvable ou déjà supprimée."

  apply-d1-migrations:
    name: Apply D1 migrations (remote)
    needs:
      - verify
      - secrets-scan
    # Strictement limité à `main` : la base ciblée (seancy-notifications) est
    # la prod. Sans ce garde-fou, un push sur `develop` rejouerait aussi les
    # migrations en attente sur la prod avant même la release correspondante
    # — voir deploy-develop pour l'équivalent sur `seancy-develop`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Bascule Bobine → Seancy : copie unique de bobine-notifications vers
      # seancy-notifications tant que celle-ci est vide, puis retrait de la
      # tâche planifiée du Worker bobine dès que seancy a la sienne. Sans
      # effet ensuite (voir scripts/seancy-copy-d1.ts).
      - name: Copy bobine-notifications → seancy-notifications (once)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/seancy-copy-d1.ts

      # Applique toute migration ajoutée sous migrations/ pas encore jouée
      # sur la base D1 distante (voir migrations/README implicite : fichiers
      # numérotés créés via `npx wrangler d1 migrations create`). Idempotent
      # — `wrangler` ignore les migrations déjà marquées comme appliquées
      # dans la table `d1_migrations` de la base. Remplace l'exécution
      # manuelle de worker/schema.sql, plus sujette à l'oubli.
      - name: Apply pending migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply seancy-notifications --remote

  # Release prod (ticket Trello "Épique git-flow : release develop→main
  # automatisée") : au push sur `main` (donc au merge d'une release
  # `develop` → `main`), compile les fragments de changelog accumulés depuis
  # la dernière release (voir .changeset/README.md et
  # scripts/changelogRelease.ts) en une entrée CHANGELOG.md + bump SemVer de
  # package.json, puis commit directement sur `main`. Un garde-fou naturel
  # contre la boucle : ce commit généré ne laisse plus aucun fragment, donc
  # le run qu'il déclenche à son tour trouve .changeset/ vide et ne fait
  # rien. `[skip ci]` évite quand même de relancer ce workflow pour rien sur
  # ce second push (le déploiement prod réel, lui, part du déploiement Git
  # Cloudflare Workers Builds branché sur `main`, qui n'obéit pas à
  # `[skip ci]` — la version buildée inclut donc bien le bump).
  #
  # Avant le basculement complet sur `develop`/`main` (voir ticket "adapter
  # le skill trello-ticket-pipeline"), aucune PR vers `main` n'ajoute encore
  # de fragment .changeset/ (check-changeset.ts n'est pour l'instant exigé
  # que sur les PR de cette branche d'intégration) : ce job tourne donc à
  # chaque push sur `main` mais ne trouve rien à compiler, sans effet.
  release-changelog:
    name: Compile changelog & bump version
    needs:
      - verify
      - secrets-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Compile changelog fragments
        id: release
        run: npm run release:changelog

      - name: Commit version bump
        if: steps.release.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json .changeset
          git commit -m "chore(release): v${{ steps.release.outputs.version }} [skip ci]"
          git push

  # Environnement `develop` persistant (voir ticket Trello "Avenir du
  # développement") : une base D1 unique (seancy-develop, créée une fois,
  # jamais supprimée) + un jeu de données fictives "full" (voir
  # scripts/fixtures/develop-seed.sql), rejoué de façon additive à chaque
  # push — contrairement aux previews de PR (une base par PR, nettoyée à la
  # fermeture), pour servir de bac à sable d'équipe entre les previews
  # éphémères et la prod. Déployé via `wrangler preview` comme les previews
  # de PR (même mécanisme, nom stable "develop" au lieu du slug de branche),
  # pas via l'intégration Git Cloudflare Workers Builds qui déploie la vraie
  # prod sur `main`.
  deploy-develop:
    name: Deploy develop environment
    needs:
      - verify
      - secrets-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      # Crée (une fois) ou réutilise seancy-develop, applique les migrations
      # en attente puis rejoue le seed "full" (additif, voir
      # scripts/fixtures/develop-seed.sql). Génère
      # wrangler.develop.generated.jsonc, utilisé par le déploiement
      # ci-dessous.
      - name: Provision develop D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/preview-d1.ts provision-develop

      - name: Deploy Worker develop environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler preview
          --config wrangler.develop.generated.jsonc
          --name develop
          --message "develop @ ${{ github.sha }}"
