name: Import Trello

# Import unique des cartes du board Trello dans les tickets de Seancy (page
# /tickets) : scripts/trello-import.ts. Lancé à la main (Actions → Import
# Trello → Run workflow), d'abord en essai à blanc pour voir ce qui serait
# importé. Rejouable : une carte déjà importée est sautée. Rien n'est envoyé
# à Claude.
#
# Secrets du dépôt : TRELLO_KEY et TRELLO_TOKEN (les mêmes valeurs que le .env
# du NAS), SEANCY_TICKETS_KEY (clé créée sur la page Tickets → Réglages).

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Board Trello (identifiant ou adresse https://trello.com/b/…)"
        required: true
      dry_run:
        description: "Essai à blanc (rien n'est envoyé)"
        type: boolean
        default: true
      target:
        description: "Serveur des tickets"
        default: "https://seancy.com/api/tickets"

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Import
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          SEANCY_TICKETS_KEY: ${{ secrets.SEANCY_TICKETS_KEY }}
          SEANCY_TICKETS_URL: ${{ inputs.target }}
          BOARD: ${{ inputs.board }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/trello-import.ts "$BOARD" $DRY
