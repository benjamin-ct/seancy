name: Récupération des secrets

# Outil ponctuel : ré-exporte les secrets GitHub Actions de ce dépôt, chiffrés avec une phrase
# secrète que tu choisis, affichés en base64 dans les logs. Le texte affiché est CHIFFRÉ :
# illisible sans la phrase secrète ; les valeurs n'apparaissent jamais en clair. À lancer à la
# main (Actions → « Récupération des secrets » → Run workflow), puis à supprimer après usage.
on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "Phrase secrète pour chiffrer l'archive (choisis-la, note-la ailleurs)"
        required: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Chiffrer et afficher les secrets
        env:
          PASSPHRASE: ${{ github.event.inputs.passphrase }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_TICKETS_WEBHOOK_URL: ${{ secrets.DISCORD_TICKETS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TICKETS_TOKEN: ${{ secrets.GITHUB_TICKETS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SEANCY_TICKETS_KEY: ${{ secrets.SEANCY_TICKETS_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TICKETS_GITHUB_TOKEN: ${{ secrets.TICKETS_GITHUB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          echo "::add-mask::$PASSPHRASE"
          jq -n \
            --arg ACCESS_AUD "$ACCESS_AUD" \
            --arg ACCESS_TEAM_DOMAIN "$ACCESS_TEAM_DOMAIN" \
            --arg ADMIN_EMAILS "$ADMIN_EMAILS" \
            --arg CF_ANALYTICS_TOKEN "$CF_ANALYTICS_TOKEN" \
            --arg CLAUDE_CODE_OAUTH_TOKEN "$CLAUDE_CODE_OAUTH_TOKEN" \
            --arg CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID" \
            --arg CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN" \
            --arg DISCORD_TICKETS_WEBHOOK_URL "$DISCORD_TICKETS_WEBHOOK_URL" \
            --arg DISCORD_WEBHOOK_URL "$DISCORD_WEBHOOK_URL" \
            --arg GITHUB_TICKETS_TOKEN "$GITHUB_TICKETS_TOKEN" \
            --arg GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID" \
            --arg GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET" \
            --arg RECAPTCHA_SECRET_KEY "$RECAPTCHA_SECRET_KEY" \
            --arg RELEASE_APP_CLIENT_ID "$RELEASE_APP_CLIENT_ID" \
            --arg RELEASE_APP_PRIVATE_KEY "$RELEASE_APP_PRIVATE_KEY" \
            --arg RESEND_API_KEY "$RESEND_API_KEY" \
            --arg RESEND_FROM_EMAIL "$RESEND_FROM_EMAIL" \
            --arg SEANCY_TICKETS_KEY "$SEANCY_TICKETS_KEY" \
            --arg SENTRY_AUTH_TOKEN "$SENTRY_AUTH_TOKEN" \
            --arg SENTRY_DSN "$SENTRY_DSN" \
            --arg TICKETS_GITHUB_TOKEN "$TICKETS_GITHUB_TOKEN" \
            --arg TMDB_API_KEY "$TMDB_API_KEY" \
            --arg TRELLO_KEY "$TRELLO_KEY" \
            --arg TRELLO_TOKEN "$TRELLO_TOKEN" \
            --arg VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY" \
            '$ARGS.named' > secrets.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt \
            -in secrets.json -out secrets.json.enc -pass env:PASSPHRASE
          rm -f secrets.json
          echo "----- DEBUT ARCHIVE CHIFFREE (base64) -----"
          base64 -w0 secrets.json.enc
          echo ""
          echo "----- FIN ARCHIVE CHIFFREE -----"
