# Export ponctuel et chiffré des secrets GitHub Actions du dépôt.
#
# ⚠️ NE PAS MERGER : ce workflow ne vit que sur sa branche, le temps d'un
# export, puis la branche est supprimée.
#
# GitHub ne permet pas de relire la valeur d'un secret (ni dans l'interface,
# ni par l'API) : seul un job Actions y a accès. Ce job les chiffre avec une
# clé publique age (`age1...`) dont seul le propriétaire détient la clé
# privée, et dépose le fichier chiffré en artefact (conservé 1 jour). Aucune
# valeur n'est écrite en clair, ni dans les logs ni sur le disque du runner.
#
# Déclenchement : un push sur la branche qui modifie
# .github/export-secrets.recipient (une ligne : la clé publique age).
# Déchiffrement côté poste local :
#   age -d -i ~/.config/age/seancy-export.txt -o github-secrets.json github-secrets.json.age
# (Windows : même commande avec "$env:USERPROFILE\.config\age\seancy-export.txt".)
#
# Non couverts (inaccessibles depuis Actions) : secrets Dependabot et
# Codespaces.

name: Export chiffré des secrets

on:
  push:
    branches: [claude/compassionate-rubin-f7c7ix]
    paths: [.github/export-secrets.recipient]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/export-secrets.recipient
          sparse-checkout-cone-mode: false

      - name: Installer age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Chiffrer les secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          RECIPIENT=$(grep -m1 -E '^age1[0-9a-z]{58}$' .github/export-secrets.recipient || true)
          if [ -z "$RECIPIENT" ]; then
            echo "::error::.github/export-secrets.recipient doit contenir une clé publique age (age1...)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/export"
          # Le jeton éphémère du job n'a aucun intérêt à être exporté.
          printf '%s' "$SECRETS_JSON" \
            | jq 'del(.github_token)' \
            | age -r "$RECIPIENT" -o "$RUNNER_TEMP/export/github-secrets.json.age"
          {
            echo "### Secrets exportés (noms uniquement)"
            printf '%s' "$SECRETS_JSON" | jq -r 'keys[] | select(. != "github_token") | "- `\(.)`"'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: github-secrets-chiffres
          path: ${{ runner.temp }}/export/github-secrets.json.age
          retention-days: 1
          if-no-files-found: error
